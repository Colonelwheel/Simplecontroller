[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-gaming-input"
version = "0.1.0"
description = "Local expression input for the existing Simplecontroller Xbox controller"
requires-python = ">=3.12,<3.13"
dependencies = ["mediapipe==0.10.21", "numpy==1.26.4", "PySide6==6.11.2"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
facial-gaming-input = "facial_input.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "integrations/receiver", "integrations/monitor/tests"]
pythonpath = ["src"]
